name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  skill-and-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Execute offline, allowlisted quality checks
        run: python scripts/run_checks.py --output .artifacts/quality-report.json
      - name: Publish local quality observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-quality-observations
          path: .artifacts/quality-report.json
          if-no-files-found: warn
          retention-days: 7
      - run: python scripts/grade_trace.py evals/good-trace.json
      - run: |
          if python scripts/grade_trace.py evals/bad-trace.json; then
            echo 'Negative eval unexpectedly passed'; exit 1
          fi
  starter-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        starter: [frontend, threejs, backend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm install --no-fund
        working-directory: templates/${{ matrix.starter }}
      - run: npm run typecheck
        working-directory: templates/${{ matrix.starter }}
      - run: npm run build
        working-directory: templates/${{ matrix.starter }}
      - run: npm test --if-present
        working-directory: templates/${{ matrix.starter }}
      - run: npm audit --audit-level=high
        working-directory: templates/${{ matrix.starter }}
      - name: Check uncompressed asset budgets (not FPS)
        if: matrix.starter != 'backend'
        run: python scripts/check_performance.py templates/${{ matrix.starter }}/dist --max-total-kib 4096 --max-file-kib 1024

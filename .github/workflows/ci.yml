name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  skill-and-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/validate_skill.py
      - run: python scripts/verify_workflows.py
      - run: python -m unittest discover -s tests -v
      - run: |
          for name in frontend threejs backend; do
            python scripts/validate_project.py "templates/$name"
            python scripts/audit_code.py "templates/$name" --fail-on-warning
            python scripts/security_gate.py "templates/$name" --fail-on medium
          done
      - run: python scripts/grade_trace.py evals/good-trace.json
      - run: |
          if python scripts/grade_trace.py evals/bad-trace.json; then
            echo 'Negative eval unexpectedly passed'; exit 1
          fi
  starter-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        starter: [frontend, threejs, backend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm install --no-fund
        working-directory: templates/${{ matrix.starter }}
      - run: npm run typecheck
        working-directory: templates/${{ matrix.starter }}
      - run: npm run build
        working-directory: templates/${{ matrix.starter }}
      - run: npm test --if-present
        working-directory: templates/${{ matrix.starter }}
      - run: npm audit --audit-level=high
        working-directory: templates/${{ matrix.starter }}
      - name: Check uncompressed asset budgets (not FPS)
        if: matrix.starter != 'backend'
        run: python scripts/check_performance.py templates/${{ matrix.starter }}/dist --max-total-kib 4096 --max-file-kib 1024
